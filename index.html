<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firestore.js";
    import { firebaseConfig } from "./config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = 'login.html';
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = 'login.html';
    });

    let registroActual = null;
    let urlQRActual = '';

    window.actualizarFormularioDatos = function() {
        const contenedor = document.getElementById('contenedor-inputs-dinamicos');
        const inputsEditor = document.querySelectorAll('#lista-campos-editor input');
        contenedor.innerHTML = '';
        inputsEditor.forEach((input, index) => {
            const nombre = input.value || `Campo ${index + 1}`;
            contenedor.innerHTML += `
                <div class="form-group">
                    <label>${nombre}</label>
                    <input type="text" class="campo-valor" data-nombre="${nombre}" placeholder="Ingrese ${nombre.toLowerCase()}">
                </div>
            `;
        });
    }

    window.agregarNuevoCampo = function() {
        document.getElementById('lista-campos-editor').innerHTML += `
            <div class="campo-row">
                <input type="text" value="Nuevo Campo" oninput="actualizarFormularioDatos()">
                <button class="btn-danger" onclick="this.parentElement.remove(); actualizarFormularioDatos();">X</button>
            </div>
        `;
        actualizarFormularioDatos();
    }

    function generarFolioUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    function generarSelloLargo() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
        let res = '';
        for (let i = 0; i < 256; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
        return res + '==';
    }

    window.guardarYGenerarRegistro = async function() {
        const inputs = document.querySelectorAll('.campo-valor');
        const datos = {};
        inputs.forEach(inp => { datos[inp.getAttribute('data-nombre')] = inp.value || 'N/A'; });

        const folio = generarFolioUUID();
        const sello = generarSelloLargo();
        const ahora = new Date();
        const fechaHora = ahora.toLocaleDateString('es-MX') + ' ' + ahora.toLocaleTimeString('es-MX');

        try {
            await addDoc(collection(db, 'registros'), {
                folio: folio,
                datos: datos,
                selloDigital: sello,
                fechaHora: fechaHora,
                timestamp: serverTimestamp()
            });

            registroActual = { folio };
            const urlValidacion = `${window.location.origin}${window.location.pathname.replace('index.html', '')}validar.html?folio=${folio}`;
            urlQRActual = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(urlValidacion)}`;

            document.getElementById('lbl-folio').textContent = folio;
            document.getElementById('lbl-fecha').textContent = fechaHora;
            document.getElementById('lbl-sello').textContent = sello;
            document.getElementById('qr-img-render').innerHTML = `<img src="${urlQRActual}" alt="QR">`;
            document.getElementById('resultado-gen').classList.remove('hidden');

            alert('¡Registro guardado con éxito!');
        } catch (error) {
            alert('Error al guardar: ' + error.message);
        }
    }

    window.descargarQR = function() {
        if (!urlQRActual) return;
        const a = document.createElement('a');
        a.href = urlQRActual;
        a.download = `QR-${registroActual.folio}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    actualizarFormularioDatos();
</script>
