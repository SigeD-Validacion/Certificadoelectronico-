<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firestore.js";
    import { firebaseConfig } from "./config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function validar() {
        const urlParams = new URLSearchParams(window.location.search);
        const folio = urlParams.get('folio');

        if (!folio) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error-box').classList.remove('hidden');
            return;
        }

        try {
            const q = query(collection(db, 'registros'), where('folio', '==', folio));
            const snapshot = await getDocs(q);

            if (snapshot.empty) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-box').classList.remove('hidden');
                return;
            }

            const docData = snapshot.docs[0].data();
            const container = document.getElementById('datos-container');
            container.innerHTML = '';

            for (const [key, value] of Object.entries(docData.datos)) {
                container.innerHTML += `
                    <div class="data-row">
                        <div class="data-label">${key}:</div>
                        <div class="data-value">${value}</div>
                    </div>
                `;
            }

            document.getElementById('val-folio').textContent = docData.folio;
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('resultado-val').classList.remove('hidden');

        } catch (error) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error-box').classList.remove('hidden');
        }
    }

    validar();
</script>
