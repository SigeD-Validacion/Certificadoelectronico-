<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Certificado Electrónico - Validación</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f4f4;color:#222}
  header{background:#6d1b3f;color:#fff;padding:16px 20px}
  header .titulo-sistema{font-size:19px;font-weight:bold}
  header .subtitulo-doc{font-size:14px;margin-top:4px;opacity:.9}
  .contenedor{max-width:640px;margin:24px auto;padding:0 16px 40px}
  .tarjeta{background:#fff;border:1px solid #ddd;border-radius:4px;padding:24px}
  h2{font-size:13px;color:#8a8a8a;font-weight:bold;text-transform:uppercase;letter-spacing:.03em;margin:24px 0 6px;border-bottom:1px solid #eee;padding-bottom:6px}
  h2:first-of-type{margin-top:0}
  table{width:100%;border-collapse:collapse}
  td{padding:9px 4px;border-bottom:1px solid #eee;vertical-align:top;font-size:14.5px}
  td:first-child{font-weight:bold;width:42%;color:#333}
  .banner{margin-top:24px;text-align:center;padding:14px;border-radius:4px;font-weight:bold;font-size:16px;color:#fff}
  .valido{background:#7cb342}
  .invalido{background:#c62828}
  .cargando,.aviso{max-width:640px;margin:60px auto;text-align:center;color:#666;padding:0 16px}
</style>
</head>
<body>

<header>
  <div class="titulo-sistema">Certificado Electrónico - Validación</div>
  <div class="subtitulo-doc" id="subtituloDoc"></div>
</header>

<div class="contenedor">
  <div id="contenido" class="cargando">Buscando folio…</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  // ⚠️ Misma configuración que en generador.html
  const firebaseConfig = {
    apiKey: "AIzaSyCrLDSRloFeTdoJFT8hahdbMfCP468NDIw",
    authDomain: "certificadoelectronico-89f1e.firebaseapp.com",
    databaseURL: "https://certificadoelectronico-89f1e-default-rtdb.firebaseio.com",
    projectId: "certificadoelectronico-89f1e",
    storageBucket: "certificadoelectronico-89f1e.firebasestorage.app",
    messagingSenderId: "1071784580481",
    appId: "1:1071784580481:web:4d53c299ef597acf6f0480"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const CATEGORIAS_ORDEN = ["Información del alumno", "Información de la institución", "Detalles académicos", "Otro"];

  async function sha512hex(texto) {
    const buffer = await crypto.subtle.digest("SHA-512", new TextEncoder().encode(texto));
    return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  async function generarSello(folio, titulo, campos) {
    const ordenados = [...campos].sort((a, b) => a.nombre.localeCompare(b.nombre));
    const cadena = folio + "|" + titulo + "|" + ordenados.map(c => `${c.nombre}=${c.valor}`).join("|");
    const parte1 = await sha512hex(cadena);
    const parte2 = await sha512hex(parte1 + "|" + folio);
    return parte1 + parte2;
  }

  function formatearTimbrado(fechaISO) {
    const d = new Date(fechaISO);
    const pad = n => String(n).padStart(2, "0");
    let horas = d.getHours();
    const ampm = horas >= 12 ? "pm" : "am";
    horas = horas % 12 || 12;
    return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()} ${pad(horas)}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${ampm}`;
  }

  const params = new URLSearchParams(window.location.search);
  const folio = params.get('folio');
  const cont = document.getElementById('contenido');

  if (!folio) {
    cont.className = 'aviso';
    cont.innerHTML = "No se proporcionó ningún folio.";
  } else {
    try {
      const snap = await get(ref(db, `documentos/${folio}`));
      if (!snap.exists()) {
        cont.className = 'aviso';
        cont.innerHTML = `No existe ningún documento con el folio <b>${folio}</b>.`;
      } else {
        const data = snap.val();
        const campos = Array.isArray(data.campos) ? data.campos : Object.entries(data.campos || {}).map(([nombre, valor]) => ({ nombre, valor, categoria: "Otro" }));
        const titulo = data.titulo || "";
        document.getElementById('subtituloDoc').textContent = titulo ? `Detalle del documento: "${titulo}"` : "";

        const selloCalculado = await generarSello(data.folio, titulo, campos);
        const esValido = selloCalculado === data.sello;

        // Agrupar por categoría, en el orden fijo, solo secciones con datos
        let html = '';
        CATEGORIAS_ORDEN.forEach(cat => {
          const delGrupo = campos.filter(c => c.categoria === cat);
          if (delGrupo.length === 0) return;
          html += `<h2>${cat}</h2><table>`;
          delGrupo.forEach(c => { html += `<tr><td>${c.nombre}</td><td>${c.valor}</td></tr>`; });
          html += `</table>`;
        });
        html += `<h2>Datos del documento</h2><table>
          <tr><td>Folio</td><td>${data.folio}</td></tr>
          <tr><td>Fecha y hora de timbrado</td><td>${formatearTimbrado(data.fechaCreacion)}</td></tr>
        </table>`;
        html += `<div class="banner ${esValido ? 'valido' : 'invalido'}">
          ${esValido ? 'Documento Validado' : 'El documento fue alterado'}
        </div>`;

        cont.className = 'tarjeta';
        cont.innerHTML = html;
      }
    } catch (e) {
      cont.className = 'aviso';
      cont.innerHTML = "Ocurrió un error al consultar el documento: " + e.message;
    }
  }
</script>
</body>
</html>
